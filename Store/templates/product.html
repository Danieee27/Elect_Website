{% load static %}

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        
        <title>{{product.name}}</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href = "{% static 'medias/favicon.ico' %}" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    
    </head>
<body>
       <!-- Navigation-->
         {% include 'navbar.html' %}
{% block content %}

<br>
<br>
<hr style="width: 80%; height: 1px; background-color: #d6d6d6; border: none; margin: 0 auto 20px auto;">

<div class = "container mb-4 p-5 ">
    
        <div class="row g-2">
          <div class="col-md-4">
            <img src="{{ product.image.url }}" class="img-fluid rounded-start" alt="...">
          </div>
          
          <div class="col-md-8">
            <div class="card-body pt-5">
              <h3 class="card-title" align = "left">{{ product.name }}</h3>
              <span class="separator" style = "display:inline-block; width:30px; height:3px; background-color: rgba(200, 200, 200, 0.4); margin:0 8px; vertical-align:left;"></span>
              <h3 class="card-title">₦{{ product.price}}</h3>
              <br>
              <p class="card-text">{{product.description}}</p>
              <br>
              <center>
              <div class="row justify-content-center">
                <div class = "col-md-2">Quantity:</div>
                <div class = "col-md-2">
                <select class="form-select" id = "qty-cart">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                </select>
                </div>
              </div>
            </br></br>
              <a href = "{% url 'home' %}" class = "btn btn-secondary">Home</a>
              <button type = "button" class = "btn btn-secondary" value = "{{ product.id }}" id = "add-cart">Add to Cart</button>
              
            </center>
            </div>
          </div>
        </div>
      

</br></br>
</br></br>
</br></br>
</br></br>
</br></br>
</br></br>
</br></br>
</br></br>
</br></br>
</br></br>
</br></br>

</div>


<script>
$(document).on('click', "#add-cart", function(e){
  e.preventDefault();
  $.ajax({
    type: 'POST',
    url: "{% url 'Cart_add' %}",
    data: {
      product_id: $('#add-cart').val(),
      product_qty: $('#qty-cart option:selected').text(),
      csrfmiddlewaretoken: "{{ csrf_token }}",
      action: 'post'
    },

    success: function(json){
      //console.log(json);
      document.getElementById("cart_quantity").textContent = json.qty
      location.reload();
    },
    error: function(xhr, errmsg, err) {

    }

  });
})
</script>


{% endblock %}

        <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="{% static 'js/scripts.js' %}"></script>

    </body>
</html>
